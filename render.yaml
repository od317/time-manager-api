services:
  - type: web
    name: timeflow-api
    env: node
    buildCommand: npm install && npx prisma generate
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: timeflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: CLIENT_URL
        value: https://your-frontend.onrender.com
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: timeflow-db
    plan: free
